apiVersion: v1
kind: Service
metadata:
  name: hyperfleet-rabbitmq
  labels:
    app.kubernetes.io/name: hyperfleet-rabbitmq
spec:
  selector:
    app.kubernetes.io/name: hyperfleet-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hyperfleet-rabbitmq
  labels:
    app.kubernetes.io/name: hyperfleet-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperfleet-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperfleet-rabbitmq
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: rabbitmq
          image: docker.io/library/rabbitmq:3.13
          ports:
            - name: amqp
              containerPort: 5672
          env:
            # Users created via RABBITMQ_DEFAULT_USER are not loopback-restricted
            # (unlike the default guest user), so in-cluster Sentinel connections
            # are accepted.
            - name: RABBITMQ_DEFAULT_USER
              value: hyperfleet
            - name: RABBITMQ_DEFAULT_PASS
              value: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            tcpSocket:
              port: amqp
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Secret
metadata:
  name: hyperfleet-broker-credentials
  labels:
    app.kubernetes.io/name: hyperfleet-rabbitmq
type: Opaque
stringData:
  # Same-namespace short DNS name: the Secret, the RabbitMQ Service, and the
  # Sentinel pods that consume it all live in the operator's namespace.
  # Test-only credentials; never reuse outside of test environments.
  BROKER_RABBITMQ_URL: amqp://hyperfleet:password@hyperfleet-rabbitmq:5672/
---
